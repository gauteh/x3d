name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"   # runs the rgw job
  workflow_dispatch:

jobs:
  # Offline: Rust unit tests, and the pytest suite against a synthetic store and a local HTTP server.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test
      - run: pip install -q -e ".[test]"   # builds the Rust extension via maturin
      - run: pytest -m "not rgw and not store" -v

  # Needs network access to the public RGW bucket (and THREDDS for the benchmark's correctness check);
  # scheduled or manual so an outage there does not block merges.
  test-rgw:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[test,bench]"
      - run: pytest -m rgw -v
