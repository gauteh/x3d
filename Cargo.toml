[package]
name = "x3d"
version = "0.1.0"
edition = "2024"
description = "Rust core for the x3d xarray backend (Zarr v3 sharded stores over HTTP)"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin only; plain `cargo test` must link libpython normally.
extension-module = ["pyo3/extension-module"]

[dependencies]
crc32c = "0.6"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
rayon = "1.12"
serde_json = "1"
thiserror = "2"
ureq = "3"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
