stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:1-bookworm
  tags:
    - k8s-root
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target

# python3-dev: libpython to link against (cargo test links the pyo3 crate normally)
.apt: &apt
  - apt-get update -qq && apt-get install -y -qq python3-venv python3-dev >/dev/null

.setup: &setup
  - python3 -m venv .venv && . .venv/bin/activate
  - pip install -q -e ".[test]"   # builds the Rust extension via maturin

# Offline: Rust unit tests, and the pytest suite against a synthetic store and a local HTTP server.
test:
  stage: test
  script:
    - *apt
    - cargo test
    - *setup
    - pytest -m "not rgw and not store" -v

# The usage snippets, the public RGW bucket (and THREDDS for the benchmark's correctness check). Fast, so it always
# runs; an outage there is a warning (allow_failure), not a blocked merge.
test-rgw:
  stage: test
  allow_failure: true
  script:
    - *apt
    - *setup
    - pip install -q ".[bench]"
    - pytest -m rgw -v

# `pip install "git+<repo>"` as in the README, from this checkout (builds the Rust extension, needs rustup): the
# backend is registered with xarray and the usage snippets run against the installed package.
test-install:
  stage: test
  script:
    - *apt
    - python3 -m venv .venv && . .venv/bin/activate
    - pip install -q pytest pytest-benchmark "zarr>=3" dask "git+file://$CI_PROJECT_DIR"
    - python -c "import xarray as xr; assert 'x3d' in xr.backends.list_engines()"
    - pytest -q tests/test_snippets.py
