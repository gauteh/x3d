stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:1-bookworm
  tags:
    - k8s-root
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target

# python3-dev: libpython to link against (cargo test links the pyo3 crate normally)
.apt: &apt
  - apt-get update -qq && apt-get install -y -qq python3-venv python3-dev >/dev/null

.setup: &setup
  - python3 -m venv .venv && . .venv/bin/activate
  - pip install -q -e ".[test]"   # builds the Rust extension via maturin

# Offline: Rust unit tests, and the pytest suite against a synthetic store and a local HTTP server.
test:
  stage: test
  script:
    - *apt
    - cargo test
    - *setup
    - pytest -m "not rgw and not store" -v

# Needs network access to the public RGW bucket (and THREDDS for the benchmark's correctness check);
# run on schedules or manually so an outage there does not block merges.
test-rgw:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - *apt
    - *setup
    - pip install -q ".[bench]"
    - pytest -m rgw -v
